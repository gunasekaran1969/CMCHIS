<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CMCHIS Application Status</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f6fb;
}

header{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0;
    font-size:24px;
}

.container{
    max-width:500px;
    margin:35px auto;
    padding:15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#0d47a1;
}

input{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:25px;
    background:#1565c0;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.result{
    display:none;
    margin-top:25px;
    padding:18px;
    background:#e3f2fd;
    border-radius:10px;
}

.status{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-top:12px;
}

.pending{
    color:#f57c00;
}

.verified{
    color:#2e7d32;
}

.rejected{
    color:#c62828;
}

.error{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#ffebee;
    color:#c62828;
    border-radius:8px;
}

a{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#1565c0;
    text-decoration:none;
}

</style>

</head>

<body>

<header>

<h1>CMCHIS Application Status</h1>

<p>Check your application status</p>

</header>


<div class="container">

<div class="card">

<h2>Check Status</h2>

<p>
Enter your Application ID:
</p>

<input
type="text"
id="applicationId"
placeholder="CMCHIS-2026-123456"
>

<button id="checkButton">
Check Application Status
</button>


<div
id="errorMessage"
class="error"
></div>


<div
id="result"
class="result"
>

<strong>Application ID:</strong>

<p id="resultId"></p>

<strong>Status:</strong>

<div
id="status"
class="status"
></div>

</div>


<a href="index.html">
← Back to Application
</a>

<a href="admin.html">
🔐 Admin Login
</a>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyABdobLpFZ6WaJ4kE8HQZMBmTUmfRJCbJY",

authDomain:
"cmchis-online-application.firebaseapp.com",

projectId:
"cmchis-online-application",

storageBucket:
"cmchis-online-application.firebasestorage.app",

messagingSenderId:
"275696534195",

appId:
"1:275696534195:web:f381966c7b5c44036a26c6",

measurementId:
"G-RSY7T0RVTD"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


document
.getElementById("checkButton")
.addEventListener(
"click",
checkStatus
);


async function checkStatus(){

const applicationId =
document
.getElementById("applicationId")
.value
.trim();


const errorBox =
document
.getElementById("errorMessage");

const resultBox =
document
.getElementById("result");

const statusBox =
document
.getElementById("status");


errorBox.style.display =
"none";

resultBox.style.display =
"none";


if(applicationId === ""){

errorBox.textContent =
"Please enter your Application ID.";

errorBox.style.display =
"block";

return;

}


try{

const q = query(

collection(
db,
"publicStatus"
),

where(
"applicationId",
"==",
applicationId
)

);


const snapshot =
await getDocs(q);


if(snapshot.empty){

errorBox.textContent =
"Application ID not found. Please check the ID and try again.";

errorBox.style.display =
"block";

return;

}


let status =
"Pending";


snapshot.forEach(
function(doc){

const data =
doc.data();

status =
data.status ||
"Pending";

});


document.getElementById(
"resultId"
).textContent =
applicationId;


statusBox.textContent =
status;


statusBox.className =
"status";


if(status === "Verified"){

statusBox.classList.add(
"verified"
);

}
else if(status === "Rejected"){

statusBox.classList.add(
"rejected"
);

}
else{

statusBox.classList.add(
"pending"
);

}


resultBox.style.display =
"block";

}

catch(error){

console.error(
"STATUS ERROR:",
error
);

errorBox.textContent =
"Unable to check status. Please make sure Firestore Rules are published.";

errorBox.style.display =
"block";

}

}

</script>

</body>
</html>
