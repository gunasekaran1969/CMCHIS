```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CMCHIS Admin Dashboard</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f6fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    text-align:center;
    padding:22px 15px;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:7px 0 0;
    font-size:14px;
}

/* LOGIN */

.login-container{
    max-width:400px;
    margin:50px auto;
    padding:15px;
}

.login-box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.login-box h2{
    text-align:center;
    color:#0d47a1;
}

input,select{
    width:100%;
    padding:12px;
    margin:7px 0 15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

button{
    border:0;
    padding:11px 17px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.login-btn{
    width:100%;
    background:#1565c0;
    color:white;
    font-size:16px;
}

.error{
    color:#c62828;
    text-align:center;
    margin-top:12px;
}

/* DASHBOARD */

#dashboard{
    display:none;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.logout{
    background:#d32f2f;
    color:white;
}

.refresh{
    background:#1976d2;
    color:white;
    margin-right:8px;
}

/* STATISTICS */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.stat-card h3{
    margin:0;
    color:#666;
    font-size:15px;
}

.stat-card p{
    font-size:28px;
    font-weight:bold;
    margin:10px 0 0;
    color:#0d47a1;
}

/* SEARCH */

.search-box{
    background:white;
    padding:18px;
    border-radius:12px;
    margin-bottom:20px;
}

.search-box input{
    margin:0;
}

/* TABLE */

.table-container{
    background:white;
    border-radius:12px;
    padding:15px;
    overflow-x:auto;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th{
    background:#0d47a1;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #ddd;
}

.status{
    padding:6px 10px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.verified{
    background:#d4edda;
    color:#155724;
}

.rejected{
    background:#f8d7da;
    color:#721c24;
}

.view-btn{
    background:#1976d2;
    color:white;
}

.delete-btn{
    background:#d32f2f;
    color:white;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.55);
    padding:20px;
    overflow:auto;
}

.modal-content{
    max-width:650px;
    margin:40px auto;
    background:white;
    border-radius:15px;
    padding:25px;
}

.close{
    float:right;
    font-size:28px;
    cursor:pointer;
}

.detail{
    margin:10px 0;
    padding:10px;
    background:#f5f7fa;
    border-radius:7px;
    word-break:break-word;
}

.detail strong{
    display:block;
    color:#555;
    margin-bottom:4px;
}

.update-btn{
    background:#1565c0;
    color:white;
    width:100%;
    margin-top:10px;
}

/* MOBILE */

@media(max-width:800px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .cards{
        grid-template-columns:1fr 1fr;
    }

    .stat-card{
        padding:14px;
    }

    .stat-card p{
        font-size:22px;
    }

}
</style>
</head>

<body>

<header>
<h1>CMCHIS Admin Dashboard</h1>
<p>Application Management System</p>
</header>


<!-- LOGIN -->

<div class="login-container" id="loginPage">

<div class="login-box">

<h2>Admin Login</h2>

<label>Admin Email</label>

<input
type="email"
id="email"
placeholder="Enter admin email"
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter password"
>

<button
class="login-btn"
id="loginButton"
>
Login
</button>

<div
class="error"
id="loginError"
></div>

</div>
</div>


<!-- DASHBOARD -->

<div id="dashboard" class="container">

<div class="top-bar">

<div>
<h2>Applications</h2>
<p>CMCHIS application management</p>
</div>

<div>

<button
class="refresh"
id="refreshButton"
>
Refresh
</button>

<button
class="logout"
id="logoutButton"
>
Logout
</button>

</div>

</div>


<!-- STATISTICS -->

<div class="cards">

<div class="stat-card">
<h3>Total Applications</h3>
<p id="totalCount">0</p>
</div>

<div class="stat-card">
<h3>Pending</h3>
<p id="pendingCount">0</p>
</div>

<div class="stat-card">
<h3>Verified</h3>
<p id="verifiedCount">0</p>
</div>

<div class="stat-card">
<h3>Rejected</h3>
<p id="rejectedCount">0</p>
</div>

</div>


<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search Application ID, name or mobile..."
>

</div>


<!-- TABLE -->

<div class="table-container">

<table>

<thead>

<tr>
<th>Application ID</th>
<th>Name</th>
<th>Mobile</th>
<th>District</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="applicationTable"></tbody>

</table>

</div>

</div>


<!-- DETAILS MODAL -->

<div
class="modal"
id="detailsModal"
>

<div class="modal-content">

<span
class="close"
id="closeModal"
>
&times;
</span>

<h2>Application Details</h2>

<div id="applicationDetails"></div>

<label>Application Status</label>

<select id="statusSelect">

<option value="Pending">Pending</option>
<option value="Verified">Verified</option>
<option value="Rejected">Rejected</option>

</select>

<button
class="update-btn"
id="updateStatusButton"
>
Update Status
</button>

</div>
</div>


<script type="module">

/* FIREBASE */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
collection,
getDocs,
doc,
updateDoc,
deleteDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey:
"AIzaSyABdobLpFZ6WaJ4kE8HQZMBmTUmfRJCbJY",

authDomain:
"cmchis-online-application.firebaseapp.com",

projectId:
"cmchis-online-application",

storageBucket:
"cmchis-online-application.firebasestorage.app",

messagingSenderId:
"275696534195",

appId:
"1:275696534195:web:f381966c7b5c44036a26c6",

measurementId:
"G-RSY7T0RVTD"

};


/* START FIREBASE */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* VARIABLES */

let applications = [];

let selectedDocumentId = null;


/* LOGIN */

document
.getElementById("loginButton")
.addEventListener(
"click",
async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const error =
document.getElementById("loginError");

error.textContent = "";

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

catch(error){

console.error(error);

document.getElementById(
"loginError"
).textContent =
"Login failed. Check your email and password.";

}

});


/* AUTH */

onAuthStateChanged(
auth,
function(user){

if(user){

document.getElementById(
"loginPage"
).style.display =
"none";

document.getElementById(
"dashboard"
).style.display =
"block";

loadApplications();

}

else{

document.getElementById(
"loginPage"
).style.display =
"block";

document.getElementById(
"dashboard"
).style.display =
"none";

}

});


/* LOAD */

async function loadApplications(){

const table =
document.getElementById(
"applicationTable"
);

table.innerHTML =
"<tr><td colspan='6'>Loading...</td></tr>";

try{

const snapshot =
await getDocs(
collection(
db,
"applications"
)
);

applications = [];

snapshot.forEach(
function(item){

applications.push({

documentId:item.id,

...item.data()

});

});

displayApplications(
applications
);

}

catch(error){

console.error(error);

table.innerHTML =
"<tr><td colspan='6'>Unable to load applications.</td></tr>";

}

}


/* DISPLAY */

function displayApplications(data){

const table =
document.getElementById(
"applicationTable"
);

table.innerHTML = "";


if(data.length === 0){

table.innerHTML =
"<tr><td colspan='6'>No applications found.</td></tr>";

updateStatistics();

return;

}


data.forEach(
function(app){

const row =
document.createElement("tr");

row.innerHTML = `

<td>${escapeHTML(app.applicationId || "")}</td>

<td>${escapeHTML(app.name || "")}</td>

<td>${escapeHTML(app.mobile || "")}</td>

<td>${escapeHTML(app.district || "")}</td>

<td>

<span class="status ${statusClass(app.status)}">

${escapeHTML(app.status || "Pending")}

</span>

</td>

<td>

<button
class="view-btn"
onclick="viewApplication('${app.documentId}')"
>
View
</button>

<button
class="delete-btn"
onclick="deleteApplication('${app.documentId}')"
>
Delete
</button>

</td>

`;

table.appendChild(row);

});

updateStatistics();

}


/* STATISTICS */

function updateStatistics(){

document.getElementById(
"totalCount"
).textContent =
applications.length;

document.getElementById(
"pendingCount"
).textContent =
applications.filter(
a => a.status === "Pending"
).length;

document.getElementById(
"verifiedCount"
).textContent =
applications.filter(
a => a.status === "Verified"
).length;

document.getElementById(
"rejectedCount"
).textContent =
applications.filter(
a => a.status === "Rejected"
).length;

}


/* STATUS CLASS */

function statusClass(status){

if(status === "Verified")
return "verified";

if(status === "Rejected")
return "rejected";

return "pending";

}


/* VIEW */

window.viewApplication =
function(documentId){

const app =
applications.find(
a => a.documentId === documentId
);

if(!app)
return;

selectedDocumentId =
documentId;

const details =
document.getElementById(
"applicationDetails"
);

details.innerHTML = `

<div class="detail">
<strong>Application ID</strong>
${escapeHTML(app.applicationId || "")}
</div>

<div class="detail">
<strong>Name</strong>
${escapeHTML(app.name || "")}
</div>

<div class="detail">
<strong>Father / Husband Name</strong>
${escapeHTML(app.fatherName || "")}
</div>

<div class="detail">
<strong>Date of Birth</strong>
${escapeHTML(app.dob || "")}
</div>

<div class="detail">
<strong>Gender</strong>
${escapeHTML(app.gender || "")}
</div>

<div class="detail">
<strong>Mobile</strong>
${escapeHTML(app.mobile || "")}
</div>

<div class="detail">
<strong>Ration Card</strong>
${escapeHTML(app.rationCard || "")}
</div>

<div class="detail">
<strong>Family Members</strong>
${escapeHTML(app.familyMembers || "")}
</div>

<div class="detail">
<strong>District</strong>
${escapeHTML(app.district || "")}
</div>

<div class="detail">
<strong>Address</strong>
${escapeHTML(app.address || "")}
</div>

<div class="detail">
<strong>Aadhaar</strong>
${escapeHTML(app.aadhaar || "")}
</div>

`;

document.getElementById(
"statusSelect"
).value =
app.status || "Pending";

document.getElementById(
"detailsModal"
).style.display =
"block";

};


/* UPDATE */

document
.getElementById("updateStatusButton")
.addEventListener(
"click",
async function(){

if(!selectedDocumentId)
return;

const newStatus =
document.getElementById(
"statusSelect"
).value;

try{

await updateDoc(

doc(
db,
"applications",
selectedDocumentId
),

{
status:newStatus
}

);

alert(
"Status updated successfully."
);

closeModal();

loadApplications();

}

catch(error){

console.error(error);

alert(
"Unable to update status."
);

}

});


/* DELETE */

window.deleteApplication =
async function(documentId){

const app =
applications.find(
a => a.documentId === documentId
);

if(!app)
return;

if(!confirm(
"Delete application " +
(app.applicationId || "") +
"?"))
return;

try{

await deleteDoc(

doc(
db,
"applications",
documentId
)

);

loadApplications();

}

catch(error){

console.error(error);

alert(
"Unable to delete application."
);

}

};


/* SEARCH */

document
.getElementById("searchInput")
.addEventListener(
"input",
function(){

const search =
this.value
.toLowerCase()
.trim();

const filtered =
applications.filter(
function(app){

return (

String(
app.applicationId || ""
)
.toLowerCase()
.includes(search)

||

String(
app.name || ""
)
.toLowerCase()
.includes(search)

||

String(
app.mobile || ""
)
.includes(search)

||

String(
app.district || ""
)
.toLowerCase()
.includes(search)

);

});

displayApplications(
filtered
);

});


/* REFRESH */

document
.getElementById("refreshButton")
.addEventListener(
"click",
function(){

loadApplications();

});


/* LOGOUT */

document
.getElementById("logoutButton")
.addEventListener(
"click",
function(){

signOut(auth);

});


/* CLOSE */

document
.getElementById("closeModal")
.addEventListener(
"click",
closeModal
);


function closeModal(){

document.getElementById(
"detailsModal"
).style.display =
"none";

selectedDocumentId =
null;

}


/* ESCAPE HTML */

function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
</html>
```
